name: Run Benchmarks

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
  schedule:
    - cron: "0 0 * * *"  # Runs at 00:00 UTC every day

permissions:
  contents: read
  pull-requests: write

jobs: 
  run_benchmarks:
    name: Test Run
    runs-on: linux-x86-ct5lp-224-8tpu
    container:
      image: node:18
    steps:
      - name: Check for dockerenv file
        run: echo "HEllo"    
